<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 1110" width="1030" height="1110">
  <!-- LaserPrep: Vom 3D-Modell zur Laserdatei – Ablauf in vier Schritten (2 × 2). Die orange Wand läuft durch alle Schritte. -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&amp;display=swap');
    text { font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; }
    .titel { font-size: 44px; font-weight: 700; fill: #111; }
    .nr { font-size: 30px; font-weight: 700; fill: #ff6a00; }
    .name { font-size: 30px; font-weight: 700; fill: #111; }
    .info { font-size: 20px; fill: #777; }
    .fuss { font-size: 18px; font-weight: 700; fill: #ff6a00; }
    .kante { stroke: #333; stroke-width: 2; stroke-linejoin: round; }
    .grau { fill: #e4e4e4; } .hell { fill: #f2f2f2; } .weiss { fill: #fff; } .orange { fill: #ff6a00; }
    .schnitt { fill: none; stroke: #ff0000; stroke-width: 2; }
    .pfeil { stroke: #ff6a00; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1030" height="1110" fill="#fff"/>
  <text class="titel" x="100" y="80">Vom 3D-Modell zur Laserdatei</text>

  <!-- 01 Modell: isometrisches Haus, Südwand orange (oben links) -->
  <g>
    <g class="kante">
      <polygon class="hell" points="215,390 120,335 120,225 215,280"/>
      <polygon class="orange" points="215,390 345,315 345,205 215,280"/>
      <polygon class="weiss" points="215,280 345,205 250,150 120,225"/>
      <polygon class="weiss" points="286.5,304.75 319,286 319,247.5 286.5,266.25"/>
      <polygon class="weiss" points="234.5,378.75 256.6,366 256.6,300 234.5,312.75"/>
    </g>
    <text x="100" y="470"><tspan class="nr">01 </tspan><tspan class="name">Modell laden</tspan></text>
    <text class="info" x="100" y="504">OBJ oder IFC, z. B. aus Archicad</text>
  </g>

  <!-- Pfeil 01 → 02 -->
  <path class="pfeil" d="M440 280 H520 M506 266 L520 280 L506 294"/>

  <!-- 02 Flach legen (oben rechts) -->
  <g transform="translate(135 0)">
    <g class="kante">
      <rect class="orange" x="465" y="170" width="150" height="110"/>
      <rect class="weiss" x="487.5" y="214" width="25.5" height="66"/>
      <rect class="weiss" x="547.5" y="197.5" width="37.5" height="38.5"/>
      <rect class="grau" x="625" y="170" width="110" height="110"/>
      <rect class="grau" x="465" y="290" width="150" height="110"/>
      <rect class="grau" x="625" y="290" width="110" height="110"/>
    </g>
    <text x="465" y="470"><tspan class="nr">02 </tspan><tspan class="name">Flach legen</tspan></text>
    <text class="info" x="465" y="504">jedes Bauteil mit Öffnungen</text>
  </g>

  <!-- Pfeil 02 → 03: vom Ende der ersten Reihe zurück an den Anfang der zweiten -->
  <path class="pfeil" d="M735 548 V568 H235 V588 M221 574 L235 588 L249 574"/>

  <!-- 03 Anordnen (unten links) -->
  <g transform="translate(-745 470)">
    <rect x="845" y="185" width="270" height="190" fill="#f6f6f6" stroke="#ffd400" stroke-width="3"/>
    <rect x="857" y="197" width="75" height="55" fill="rgba(255,106,0,0.18)" stroke="none"/>
    <g class="schnitt">
      <rect x="857" y="197" width="75" height="55"/>
      <rect x="868.25" y="219" width="12.75" height="33"/>
      <rect x="898.25" y="210.75" width="18.75" height="19.25"/>
      <rect x="942" y="197" width="55" height="55"/>
      <rect x="1007" y="197" width="75" height="55"/>
      <rect x="857" y="262" width="55" height="55"/>
      <rect x="922" y="262" width="75" height="55"/>
      <rect x="1007" y="262" width="55" height="55"/>
    </g>
    <text x="845" y="470"><tspan class="nr">03 </tspan><tspan class="name">Anordnen</tspan></text>
    <text class="info" x="845" y="504">im Maßstab, platzsparend</text>
    <text class="info" x="845" y="530">auf der Pappe</text>
  </g>

  <!-- Pfeil 03 → 04 -->
  <path class="pfeil" d="M440 750 H520 M506 736 L520 750 L506 764"/>

  <!-- 04 Lasern & bauen (unten rechts) -->
  <g transform="translate(-635 470)">
    <g class="kante">
      <path class="weiss" d="M1235 170 H1325 L1355 200 V350 H1235 Z"/>
      <path class="hell" d="M1325 170 V200 H1355"/>
    </g>
    <g class="schnitt">
      <rect x="1252" y="215" width="40" height="30"/>
      <rect x="1300" y="215" width="30" height="30"/>
      <rect x="1252" y="253" width="30" height="30"/>
    </g>
    <text x="1284" y="312" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#111">SVG · DXF</text>
    <g class="kante">
      <path class="weiss" d="M1335 230 H1425 L1455 260 V410 H1335 Z"/>
      <path class="hell" d="M1425 230 V260 H1455"/>
      <polygon class="hell" points="1385,330 1360,316 1360,287 1385,301"/>
      <polygon class="orange" points="1385,330 1419,310 1419,281 1385,301"/>
      <polygon class="weiss" points="1385,301 1419,281 1394,267 1360,287"/>
    </g>
    <text x="1395" y="390" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#111">Anleitung</text>
    <text x="1235" y="470"><tspan class="nr">04 </tspan><tspan class="name">Lasern &amp; bauen</tspan></text>
    <text class="info" x="1235" y="504">Laserdatei + Bauanleitung</text>
  </g>

  <text class="fuss" x="100" y="1070">LaserPrep · unfold your ideas</text>
</svg>
